    <script>
      // 主题预设脚本：在 React 挂载前应用深浅色，避免首屏白闪。
      (function () {
        try {
          var saved = localStorage.getItem('cet4.theme');
          var isDark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (err) {
          /* localStorage 不可用时忽略，回落到系统偏好 */
        }
      })();
    </script>
