name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上并发的 CI 直接取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · verify-data
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ——— 铁律 A6：音频零入库门禁 ———
      - name: 门禁 1 · 仓库内无音频文件
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -Ei '\.(mp3|m4a|wav|ogg|flac|aac|wma)$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::铁律 A6 违反：仓库内存在音频文件"
            echo "$hits"
            exit 1
          fi
          echo "✓ 无音频文件"

      # ——— 合规附录 B-5：无大二进制 ———
      - name: 门禁 2 · 仓库内无 PDF / 大二进制
        run: |
          set -euo pipefail
          hits="$(git ls-files | grep -Ei '\.(pdf|zip|rar|7z|mp4)$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::仓库内存在被禁止的二进制文件"
            echo "$hits"
            exit 1
          fi
          big="$(git ls-files | while read -r f; do [ -f "$f" ] || continue; s=$(wc -c <"$f"); [ "$s" -gt 1048576 ] && echo "$f ($s bytes)"; done || true)"
          if [ -n "$big" ]; then
            echo "::error::单文件超过 1 MB"
            echo "$big"
            exit 1
          fi
          echo "✓ 无大二进制"

      # ——— public/data 白名单守卫：禁止把临时探针 / 草稿塞进随包分发目录 ———
      # 起因：曾有人把 _regex_probe.txt 写进 public/data/，被 vite build 复制进 dist/ 造成污染。
      # 该目录随仓库分发，只允许下列「管线产出」；新增产物类型必须显式扩白名单。
      # 用 find 而非 git ls-files —— 这样**未跟踪**的新文件也能当场拦住。
      - name: 门禁 2b · public/data 仅含白名单产物
        run: |
          set -euo pipefail
          # papers/ = 套卷管线产出（scripts/build-papers.ts）：index.json 目录 + 每套卷一个 <paperId>.json
          allowed='^\.gitkeep$|^ATTRIBUTION\.md$|^VERIFY-REPORT\.md$|^manifest\.json$|^words\.index\.(core|full)\.json$|^words/chunk-[0-9]{3}\.json$|^papers/index\.json$|^papers/[a-z0-9][a-z0-9._-]*\.json$'
          bad="$(find public/data -type f | sed 's|^public/data/||' | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "::error::public/data/ 出现非白名单文件（该目录随包分发，只允许管线产出）"
            echo "$bad"
            exit 1
          fi
          echo "✓ public/data 仅含白名单产物"

      - name: 类型检查
        run: pnpm typecheck

      - name: 静态检查
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      # ——— M1 验收：domain/fsrs 覆盖率 ≥ 85%（vitest 阈值已写入 vitest.config.ts）———
      - name: 领域层覆盖率门禁（≥85%）
        run: pnpm test:coverage

      - name: 数据体检
        run: pnpm data:verify

      # ——— 铁律 A6 / A7：套卷构建期门禁（docs/04 §5.7.3）———
      - name: 套卷门禁 · 音频零入库 + 来源标注 + 题号结构
        run: pnpm data:verify-papers

      # ——— 与门禁 3b 同款：产物必须与管线一致，禁止手改 / 用陈旧产物 ———
      - name: 门禁 2c · 套卷产物幂等（管线 == 产物）
        run: |
          set -euo pipefail
          pnpm data:papers
          if ! git diff --exit-code -- public/data/papers; then
            echo "::error::public/data/papers 与 scripts/build-papers.ts 产出不一致（禁止手改或用陈旧产物）"
            exit 1
          fi
          echo "✓ 套卷产物与管线一致"

      # ——— 合规附录 B-3：ATTRIBUTION 必须存在 ———
      - name: 门禁 3 · ATTRIBUTION.md 存在且含关键声明
        run: |
          set -euo pipefail
          test -f public/data/ATTRIBUTION.md || { echo "::error::缺少 public/data/ATTRIBUTION.md"; exit 1; }
          grep -q "CC BY-NC-SA 4.0" public/data/ATTRIBUTION.md || { echo "::error::ATTRIBUTION 未声明 CC BY-NC-SA 4.0"; exit 1; }
          grep -q "exam-data/CETVocabulary" public/data/ATTRIBUTION.md || { echo "::error::ATTRIBUTION 未署名数据源"; exit 1; }
          echo "✓ 溯源声明完整"

      # ——— ATTRIBUTION 幂等门禁（docs/03 §9.2）：产物必须与生成器一致，禁止手改 / 用旧产物 ———
      - name: 门禁 3b · ATTRIBUTION 幂等（生成器 == 产物）
        run: |
          set -euo pipefail
          pnpm data:attribution
          if ! git diff --exit-code -- public/data/ATTRIBUTION.md; then
            echo "::error::public/data/ATTRIBUTION.md 与 scripts/LICENSE-NOTICE.ts 产出一致性校验失败（禁止手改或用陈旧产物）"
            exit 1
          fi
          echo "✓ ATTRIBUTION 与生成器一致"

      - name: 构建
        run: pnpm build

      # 说明：不能简单 grep 文件名（代码里本来就有 'words/chunk-001.json' 这类路径常量），
      # 要 grep 的是**数据本身的 JSON 键**（带引号），它们只可能来自被打包进去的词库数据。
      - name: 门禁 4 · 数据未进 JS bundle
        run: |
          set -euo pipefail
          if grep -qE '"(freqCount|freqRank|headword|senses)":' dist/assets/*.js 2>/dev/null; then
            echo "::error::词库数据被打包进了 JS bundle（应使用运行时 fetch）"
            exit 1
          fi
          echo "✓ 数据未进 bundle（仅含数据路径常量，无实际词条）"

      # ——— 合规附录 B-16：禁用词门禁（规则单一真源 = scripts/forbidden-words.ts） ———
      # 扫描范围：src/** + README.md + public/data/ATTRIBUTION.md（对外可见 / 随包分发）
      # 排除 tests/、scripts/、docs/：回归 fixture 与规则文件必然含禁用词串，进入范围会命中自己
      # 范围真源 = scripts/forbidden-words.ts 的 SCAN_ROOTS / SCAN_FILES（docs/04 §5.7.1）
      - name: 门禁 5 · 禁用词检查
        run: pnpm tsx scripts/check-forbidden-words.ts

